<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Logo ring: two neon rings, one inside the other (the same as the ring in the top bar).
       Dark disc behind it so it shows on light and dark tabs. -->
  <circle cx="16" cy="16" r="16" fill="#05080d"/>
  <g fill="none" stroke="#00f0ff">
    <circle cx="16" cy="16" r="12.5" stroke-width="2.8"/>
    <circle cx="16" cy="16" r="6.8" stroke-width="2.6" stroke-opacity="0.85"/>
  </g>
</svg>
